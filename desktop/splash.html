<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PicoScope Impedance Analyzer</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #070b0f; color: #d8e4ec;
        font-family: -apple-system, "SF Pro Text", sans-serif;
        display: grid; place-items: center; user-select: none;
      }
      .wrap { text-align: center; }
      h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; margin: 0 0 6px; }
      p { font-size: 12px; color: #7b8f9e; margin: 0; }
      .bar {
        width: 220px; height: 3px; margin: 18px auto 0; border-radius: 99px;
        background: #16232d; overflow: hidden;
      }
      .bar i {
        display: block; width: 40%; height: 100%; border-radius: 99px;
        background: #22d3ee; animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>PicoScope Impedance Analyzer</h1>
      <p>starting the measurement server…</p>
      <div class="bar"><i></i></div>
    </div>
  </body>
</html>
